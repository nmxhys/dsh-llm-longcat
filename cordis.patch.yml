# dsh-llm-longcat — the bundle layer applied when a profile lists this package.
#
# Registers the `longcat` provider route on ctx.llm. Every field below is a
# default the user's `llm-longcat:` settings section can override without a
# restart; the API key is a reference resolved per request, so no secret
# belongs in this file.
#
# Model facts come from GET /openai/v1/models/LongCat-2.0, the only documented
# endpoint that reports capabilities.

- insert:
    - id: llm-longcat
      name: dsh-llm-longcat
      config:
        apiKeyEnv: LONGCAT_API_KEY
        # Omitted baseURL falls back to $LONGCAT_BASE_URL, then the public API.
        thinking: enabled
        reasoningEffort: high
        models:
          - id: LongCat-2.0
            name: LongCat-2.0
            contextWindow: 1048576
            maxTokens: 131072
