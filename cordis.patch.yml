# dsh-llm-longcat — the bundle layer applied when a profile lists this package.
#
# Registers the `longcat` provider route on ctx.llm. Every field below is a
# composition default: the same values are editable through the harness
# settings form, which projects this plugin's Config schema. The API key is a
# reference resolved per request, so no secret belongs in this file.
#
# Model facts come from GET /openai/v1/models/{model}, the only documented
# endpoint that reports capabilities and modalities.

- insert:
    - id: llm-longcat
      name: dsh-llm-longcat
      config:
        apiKeyEnv: LONGCAT_API_KEY
        # Omitted baseURL falls back to $LONGCAT_BASE_URL, then the public API.
        thinking: enabled
        reasoningEffort: high
        models:
          - id: LongCat-2.5-Preview
            name: LongCat-2.5-Preview
            description: Native multi-modal agentic model; accepts text and images.
            contextWindow: 1048576
            maxTokens: 131072
            inputModalities: [text, image]
          - id: LongCat-2.0
            name: LongCat-2.0
            contextWindow: 1048576
            maxTokens: 131072
            inputModalities: [text]
